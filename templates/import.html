{% extends "base.html" %}

{% block title %}Import Attendees{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow p-4">

        <h2 class="text-primary">Import Attendees (CSV)</h2>

        {% if success %}
        <div class="alert alert-success">
            {{ success }}
        </div>
        {% endif %}

        {% if skipped %}
        <div class="alert alert-warning">
            {{ skipped }}
        </div>
        {% endif %}
        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">

                <input
                    type="file"
                    name="file"
                    accept=".csv"
                    class="form-control"
                    required>

            </div>

            <button class="btn btn-primary">

                Import CSV

            </button>

        </form>

    </div>

</div>

{% endblock %}
