{% extends "base.html" %}

{% block title %}Edit Attendee{% endblock %}

{% block content %}

<div class="card p-4">

<h2>Edit Attendee</h2>

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input
type="text"
class="form-control"
name="name"
value="{{ attendee.name }}">

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
name="email"
value="{{ attendee.email }}">

</div>

<div class="mb-3">

<label>Phone</label>

<input
type="text"
class="form-control"
name="phone"
value="{{ attendee.phone }}">

</div>

<div class="mb-3">

<label>Event</label>

<input
type="text"
class="form-control"
name="event"
value="{{ attendee.event }}">

</div>

<div class="mb-3">

<label>Category</label>

<input
type="text"
class="form-control"
name="category"
value="{{ attendee.category }}">

</div>

<button class="btn btn-success">

Update

</button>

</form>

</div>

{% endblock %}
