{% extends "base.html" %}

{% block title %}Analytics{% endblock %}

{% block content %}

<h2 class="mb-4 text-primary">Attendee Analytics</h2>

<div class="row">

    <div class="col-md-3">
        <div class="card p-3 shadow">
            <h5>Total Attendees</h5>
            <h2>{{ total }}</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card p-3 shadow">
            <h5>Students</h5>
            <h2>{{ students }}</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card p-3 shadow">
            <h5>Professionals</h5>
            <h2>{{ professionals }}</h2>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card p-3 shadow">
            <h5>Speakers</h5>
            <h2>{{ speakers }}</h2>
        </div>
    </div>

</div>

<div class="row mt-4">

    <div class="col-md-6">

        <div class="card p-3 shadow">

            <h4>Category Distribution</h4>

            <canvas id="categoryChart"></canvas>

        </div>

    </div>

    <div class="col-md-6">

        <div class="card p-3 shadow">

            <h4>Event Distribution</h4>

            <canvas id="eventChart"></canvas>

        </div>

    </div>

</div>

<script>

new Chart(document.getElementById("categoryChart"),{

type:'pie',

data:{

labels:["Students","Professionals","Speakers"],

datasets:[{

data:[
{{ students }},
{{ professionals }},
{{ speakers }}
]

}]

}

});

new Chart(document.getElementById("eventChart"),{

type:'bar',

data:{

labels:["AI Workshop","Hackathon","Cloud Summit"],

datasets:[{

label:"Registrations",

data:[
{{ ai }},
{{ hackathon }},
{{ cloud }}
]

}]

}

});

</script>

{% endblock %}
